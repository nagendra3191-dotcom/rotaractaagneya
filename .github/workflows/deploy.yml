name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install

      - name: Build Application
        run: bun run build
        env:
          GITHUB_PAGES: "1"

      - name: Prepare static files
        run: |
          cp CNAME dist/client/CNAME
          cp dist/client/index.html dist/client/404.html
          touch dist/client/.nojekyll
          # Photos are stored on Lovable; point them at the Lovable site
          grep -rl "/__l5e/assets-v1" dist/client | xargs -r sed -i 's#"/__l5e/assets-v1#"https://aagneyan-gold-glow.lovable.app/__l5e/assets-v1#g'

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Build Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Updated to target the correct folder generated by bun run build:
          path: ./dist/client

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
